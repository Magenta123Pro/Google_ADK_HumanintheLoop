repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
  - repo: local
    hooks:
      - id: semgrep-api-key-scan
        name: Semgrep API Key Scan
        entry: uv run semgrep scan --config .semgrep/rules.yaml --error
        language: system
        files: \.(py|json|yaml|yml|js)$
